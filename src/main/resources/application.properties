# Nome da aplicação
spring.application.name=crud-usuarios-springboot

# Porta - Azure define automaticamente
server.port=${PORT:8080}

# H2 Database - Modo arquivo
spring.datasource.url=jdbc:h2:file:./data/bootcamp;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Console H2 - DESABILITADO
spring.h2.console.enabled=false

# Recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.com.bootcamp=INFO