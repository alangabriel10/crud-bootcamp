# Nome da aplicação
spring.application.name=crud-usuarios-springboot

# Porta - Azure injeta PORT como variável de ambiente
server.port=${PORT:8080}

# H2 em memória (mais estável no Azure - sem problemas de permissão de arquivo)
spring.datasource.url=jdbc:h2:mem:bootcampdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console H2 - desabilitado em produção
spring.h2.console.enabled=false

# Recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.com.bootcamp=INFO